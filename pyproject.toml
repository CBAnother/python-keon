[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "keon"
version = "0.1.2"
description = "Various easy-to-use tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "XiaoYi", email = "ad@xiaoyi.fit" }
]
classifiers = [
  "Programming Language :: Python :: 3.10",
]
dependencies = [
  'pyperclip',
  'pandas',
  'requests',
  'pyyaml',
  'pypdf',
  'pywin32; platform_system == "Windows"',
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
